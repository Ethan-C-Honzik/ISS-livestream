<!DOCTYPE html>
<html>
<head>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <style>
        html, body { 
            margin: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: black; 
        }
        .video-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: calc(100vw * 9 / 16);
            border: none;
            transform: translate(-50%, -44%);
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe src="https://www.youtube-nocookie.com/embed/fO9e9jnhYK8?autoplay=1&mute=1&controls=0&loop=1&playlist=fO9e9jnhYK8&enablejsapi=1&vq=hd2160" 
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>
</body>
</html>
